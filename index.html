<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест GitHub Pages</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #0f766e);
      color: #fff;
      padding: 16px;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 8px 0; line-height: 1.5; opacity: 0.9; }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #fff;
      color: #1e3a8a;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    #count { font-weight: bold; }
    small { display: block; margin-top: 20px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Сайт работает 🎉</h1>
    <p>Эта страница опубликована через GitHub Pages.</p>
    <p>Адрес: <span id="url"></span></p>
    <button id="btn">Нажми меня</button>
    <p>Нажатий: <span id="count">0</span></p>
    <small>Открыто: <span id="time"></span></small>
  </div>

  <script>
    document.getElementById('url').textContent = location.href;
    document.getElementById('time').textContent = new Date().toLocaleString('ru-RU');
    let n = 0;
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('count').textContent = ++n;
    });
  </script>
</body>
</html>
